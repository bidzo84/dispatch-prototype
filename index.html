<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>DISPATCH</title>
<style>
/* ============================================================
   DISPATCH  //  single-file prototype
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
:root{
  --bg:#05070d; --bg2:#080c15; --bg3:#0d1220;
  --panel:rgba(255,255,255,.045);
  --panel2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.16);
  --txt:#e9eef8; --dim:#8892a6; --dim2:#5d6679;
  --cy:#22d3ee; --mg:#ff3ad4; --am:#fbbf24; --gr:#34d399; --rd:#fb5c6c; --vi:#a78bfa; --bl:#4f8bff;
  --ac:#22d3ee; --ac2:#ff3ad4;
  --c-common:#95a0b3; --c-uncommon:#34d399; --c-rare:#38bdf8;
  --c-epic:#b06bff; --c-legendary:#fbbf24; --c-mythic:#ff4d5e; --c-prototype:#ffffff;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
body{
  font-family:var(--sans); color:var(--txt); background:var(--bg);
  -webkit-font-smoothing:antialiased; user-select:none;
}
/* every inline icon gets a size; class rules below override where needed */
svg{width:16px;height:16px;flex:0 0 auto}
.x svg{width:15px;height:15px}
.slotempty svg{width:13px;height:13px;vertical-align:-2px;opacity:.75}
.lockbadge svg{width:9px;height:9px;vertical-align:-1px}
.av svg,.avatar svg{width:100%;height:100%;display:block}
/* --- ambient background --- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
#bg .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;transition:background 1.2s ease}
#bg .g1{width:70vw;height:70vw;left:-25vw;top:-18vh;background:radial-gradient(circle,var(--ac),transparent 68%)}
#bg .g2{width:65vw;height:65vw;right:-25vw;top:26vh;background:radial-gradient(circle,var(--ac2),transparent 68%);opacity:.32}
#bg .g3{width:80vw;height:60vw;left:-10vw;bottom:-20vh;background:radial-gradient(circle,#1b2a6b,transparent 70%);opacity:.42}
#bg .grid{position:absolute;inset:-40%;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:42px 42px;
  transform:perspective(340px) rotateX(58deg) translateY(6%);
  mask-image:radial-gradient(ellipse at 50% 22%,#000 0%,transparent 66%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 22%,#000 0%,transparent 66%);
  animation:gridflow 14s linear infinite; opacity:.75;
}
@keyframes gridflow{to{background-position:0 42px,0 0}}
#bg .scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);opacity:.5}
#bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.72) 100%)}

/* --- shell --- */
#app{position:relative;z-index:1;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}

/* --- top bar --- */
#top{padding:calc(var(--sat) + 8px) 12px 8px;flex:0 0 auto;
  background:linear-gradient(180deg,rgba(5,7,13,.92),rgba(5,7,13,.55) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.brandrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand{font-family:var(--mono);font-size:13px;letter-spacing:.34em;font-weight:700;
  background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px color-mix(in srgb,var(--ac) 55%,transparent))}
.brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim2);margin-left:auto;text-align:right;line-height:1.4}
.lvlpill{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:var(--panel)}
.lvlpill b{color:var(--txt);font-size:11px}
.xpbar{width:46px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:2px;transition:width .5s}
.cur{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cbox{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border-radius:11px;
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));position:relative;overflow:hidden}
.cbox svg{width:15px;height:15px}
.cbox .v{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.02em}
.cbox .k{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;color:var(--dim2)}
.cbox.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
.cbox.bump::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,var(--ac),transparent 70%);opacity:.45;animation:fadeout .6s ease forwards}
@keyframes fadeout{to{opacity:0}}

/* --- scroll body --- */
#view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:6px 12px calc(96px + var(--sab));scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.screen{animation:sIn .34s cubic-bezier(.22,1,.36,1)}
@keyframes sIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* --- typography bits --- */
.sect{display:flex;align-items:center;gap:8px;margin:18px 2px 9px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.24em;color:var(--dim2);text-transform:uppercase}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sect .cnt{color:var(--ac);letter-spacing:.1em}
h2.title{font-size:21px;margin:6px 0 2px;letter-spacing:-.02em;font-weight:800}
p.lede{margin:0 0 4px;color:var(--dim);font-size:12.5px;line-height:1.55}
.mono{font-family:var(--mono)}

/* --- generic card --- */
.card{position:relative;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.018));
  overflow:hidden;margin-bottom:10px}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.06) 48%,transparent 62%)}
.tap{cursor:pointer;transition:transform .13s ease,border-color .2s}
.tap:active{transform:scale(.978)}

/* --- buttons --- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:14px;
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;color:#04070e;cursor:pointer;
  background:linear-gradient(100deg,var(--ac),var(--ac2));
  box-shadow:0 8px 26px -8px color-mix(in srgb,var(--ac) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn[disabled]{background:rgba(255,255,255,.07);color:var(--dim2);box-shadow:none;cursor:default}
.btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.sm{padding:10px;font-size:10.5px}
.btn.danger{background:linear-gradient(100deg,#ff5f6d,#ff2e63)}

/* --- chips --- */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  padding:4px 7px;border-radius:7px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.04);white-space:nowrap}
.chip.pos{color:var(--gr);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.09)}
.chip.neg{color:var(--rd);border-color:rgba(251,92,108,.3);background:rgba(251,92,108,.09)}
.chip.rare{color:var(--vi);border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.1)}
.chip.ac{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 35%,transparent);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.chiprow{display:flex;flex-wrap:wrap;gap:5px}

/* --- risk colors --- */
.r-safe{--rk:#34d399}.r-standard{--rk:#38bdf8}.r-risky{--rk:#fbbf24}
.r-extreme{--rk:#ff7a45}.r-legendary{--rk:#ff3d71}

/* --- mission card --- */
.mcard{padding:13px 13px 12px;padding-left:16px}
.mcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rk);
  box-shadow:0 0 14px var(--rk)}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mname{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.mmeta{font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--dim2);margin-top:3px;text-transform:uppercase}
.ring{flex:0 0 auto;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--rk) calc(var(--p)*1%),rgba(255,255,255,.08) 0);}
.ring::before{content:"";position:absolute;inset:3.5px;border-radius:50%;background:#0a0e17}
.ring i{position:relative;font-family:var(--mono);font-size:13px;font-weight:700;font-style:normal;color:var(--rk)}
.ring b{position:absolute;bottom:6px;font-family:var(--mono);font-size:6px;letter-spacing:.1em;color:var(--dim2);font-weight:500}
.mfoot{display:flex;align-items:center;gap:10px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .k{font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;color:var(--dim2)}
.stat .v{font-family:var(--mono);font-size:12.5px;font-weight:700}
.stat .v.ops{color:var(--am)}
.go{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.16em;font-weight:700;color:#05070d;
  padding:8px 13px;border-radius:9px;background:linear-gradient(100deg,var(--ac),var(--ac2));
  box-shadow:0 6px 18px -6px color-mix(in srgb,var(--ac) 80%,transparent)}

/* --- active mission --- */
.run{padding:12px 13px}
.run .top{display:flex;align-items:center;gap:10px}
.avatar{flex:0 0 auto;width:40px;height:40px;border-radius:11px;overflow:hidden;border:1px solid var(--line2);background:#0b1120}
.avatar svg{display:block;width:100%;height:100%}
.run .nm{font-size:13.5px;font-weight:700;line-height:1.2}
.run .sb{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--dim2);margin-top:2px;text-transform:uppercase}
.tmr{margin-left:auto;text-align:right}
.tmr .t{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--ac);
  text-shadow:0 0 16px color-mix(in srgb,var(--ac) 60%,transparent)}
.tmr .l{font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;color:var(--dim2)}
.prog{height:4px;border-radius:3px;background:rgba(255,255,255,.09);margin-top:11px;overflow:hidden;position:relative}
.prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1s linear}
.prog::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-100%);animation:shim 2.1s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.ready .tmr .t{color:var(--gr);text-shadow:0 0 18px rgba(52,211,153,.6);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.55}}
.slotempty{border:1px dashed var(--line2);border-radius:16px;padding:16px;text-align:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--dim2);margin-bottom:10px}
.slotlock{opacity:.45}

/* --- map card --- */
.mapcard{height:104px;display:flex;align-items:flex-end;padding:12px 13px;position:relative}
.mapcard .art{position:absolute;inset:0;opacity:.85}
.mapcard .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,13,.94) 30%,rgba(5,7,13,.35))}
.mapcard .in{position:relative;width:100%}
.mapcard .idx{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:var(--mc)}
.mapcard .nm{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.mapcard .ds{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.35}
.locked{filter:grayscale(.85) brightness(.62)}
.lockbadge{position:absolute;right:11px;top:11px;font-family:var(--mono);font-size:8px;letter-spacing:.14em;
  color:var(--dim);border:1px solid var(--line2);border-radius:6px;padding:3px 6px;background:rgba(0,0,0,.5)}

/* --- sector grid --- */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scell{position:relative;border-radius:13px;border:1px solid var(--line);padding:11px 10px 10px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));overflow:hidden}
.scell .n{font-size:12.5px;font-weight:700;line-height:1.2}
.scell .m{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--dim2);margin-top:5px}
.scell .dot{position:absolute;right:9px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--ac);
  box-shadow:0 0 10px var(--ac)}
.scell.undisc{border-style:dashed}
.scell.undisc .n{color:var(--dim2)}

/* --- crew card --- */
.crewcard{padding:12px 13px;display:flex;gap:11px;align-items:center}
.crewcard .av{flex:0 0 auto;width:52px;height:52px;border-radius:14px;overflow:hidden;border:1px solid var(--line2)}
.crewcard .body{flex:1;min-width:0}
.crewcard .nm{font-size:14.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.cls{font-family:var(--mono);font-size:8px;letter-spacing:.16em;padding:2px 6px;border-radius:5px;
  border:1px solid color-mix(in srgb,var(--cc) 40%,transparent);color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,transparent)}
.lvl{font-family:var(--mono);font-size:9px;color:var(--dim2);letter-spacing:.1em;margin-top:3px}
.bars{display:grid;gap:3px;margin-top:7px}
.bar{display:grid;grid-template-columns:52px 1fr 22px;gap:6px;align-items:center}
.bar .k{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;color:var(--dim2)}
.bar .t{height:3px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--cc),color-mix(in srgb,var(--cc) 30%,#fff));transition:width .6s}
.bar .v{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:right}
.busy{position:absolute;right:11px;top:11px;font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;color:var(--am);
  border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.1);padding:3px 6px;border-radius:6px}

/* --- gear --- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gitem{position:relative;border-radius:13px;padding:11px 10px;border:1px solid color-mix(in srgb,var(--rc) 30%,var(--line));
  background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 13%,transparent),rgba(255,255,255,.015));overflow:hidden}
.gitem::after{content:"";position:absolute;right:-16px;top:-16px;width:52px;height:52px;border-radius:50%;
  background:var(--rc);filter:blur(20px);opacity:.4}
.gitem .ic{width:22px;height:22px;color:var(--rc);margin-bottom:6px}
.gitem .n{font-size:12px;font-weight:700;line-height:1.2;position:relative}
.gitem .e{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.35;position:relative}
.gitem .r{font-family:var(--mono);font-size:7px;letter-spacing:.18em;color:var(--rc);margin-top:7px;position:relative}
.gitem .q{position:absolute;right:9px;bottom:8px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--rc)}
.gitem.equipped{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 60%,transparent)}

/* --- rivals --- */
.lb{padding:0;overflow:hidden}
.lbrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}
.lbrow:last-child{border-bottom:none}
.lbrow .pos{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim2);width:22px}
.lbrow.me{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 14%,transparent),transparent)}
.lbrow.me .pos{color:var(--ac)}
.lbrow .nm{font-size:13px;font-weight:700}
.lbrow .tg{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--dim2);margin-top:2px}
.lbrow .sc{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--am)}
.lbrow .rv{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#05070d;
  background:linear-gradient(100deg,#ff5f6d,#ff2e63);padding:7px 10px;border-radius:8px;font-weight:700}

/* --- log --- */
.logrow{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.logrow:last-child{border-bottom:none}
.logrow .d{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-top:5px;background:var(--lc);box-shadow:0 0 9px var(--lc)}
.logrow .tx{font-size:12px;line-height:1.45;color:var(--txt)}
.logrow .tx b{color:var(--lc)}
.logrow .tm{font-family:var(--mono);font-size:8px;color:var(--dim2);margin-top:2px;letter-spacing:.1em}

/* --- objectives --- */
.obj{display:flex;align-items:center;gap:10px;padding:10px 12px}
.obj .tk{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center}
.obj.done .tk{background:var(--gr);border-color:var(--gr)}
.obj.done .tk svg{width:12px;height:12px;color:#04070e}
.obj .tt{font-size:12.5px;font-weight:600}
.obj .pg{font-family:var(--mono);font-size:8.5px;color:var(--dim2);letter-spacing:.1em;margin-top:2px}
.obj .rw{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--am)}

/* --- bottom nav --- */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 10px calc(8px + var(--sab));gap:4px;
  background:linear-gradient(0deg,rgba(5,7,13,.97) 55%,rgba(5,7,13,.6) 85%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:12px;
  color:var(--dim2);cursor:pointer;transition:color .2s,background .2s;position:relative}
.nb svg{width:20px;height:20px}
.nb span{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em}
.nb.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 11%,transparent)}
.nb.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:18px;height:2px;
  border-radius:2px;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.nb .badge{position:absolute;top:4px;right:calc(50% - 18px);min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:var(--rd);color:#fff;font-family:var(--mono);font-size:8px;font-weight:700;display:grid;place-items:center;
  box-shadow:0 0 10px rgba(251,92,108,.7)}

/* --- sheet --- */
#sheetwrap{position:fixed;inset:0;z-index:60;display:none}
#sheetwrap.on{display:block}
#sheetbg{position:absolute;inset:0;background:rgba(2,4,9,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  animation:fin .25s ease}
@keyframes fin{from{opacity:0}}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92dvh;overflow-y:auto;
  background:linear-gradient(180deg,#0d1220,#070a12);border-top:1px solid var(--line2);
  border-radius:24px 24px 0 0;padding:8px 14px calc(20px + var(--sab));
  box-shadow:0 -24px 60px rgba(0,0,0,.75);animation:sup .38s cubic-bezier(.22,1,.36,1);scrollbar-width:none}
#sheet::-webkit-scrollbar{display:none}
@keyframes sup{from{transform:translateY(100%)}}
.grab{width:36px;height:4px;border-radius:3px;background:var(--line2);margin:6px auto 12px}
.shead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.shead .t{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.shead .s{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim2);margin-top:4px;text-transform:uppercase}
.x{margin-left:auto;flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}

/* selectable pick rows */
.pick{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.035);margin-bottom:7px;transition:border-color .18s,background .18s,transform .12s}
.pick:active{transform:scale(.985)}
.pick.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent),0 8px 22px -12px var(--ac)}
.pick.off{opacity:.4}
.pick .av{width:40px;height:40px;border-radius:11px;overflow:hidden;flex:0 0 auto;border:1px solid var(--line2)}
.pick .nm{font-size:13px;font-weight:700}
.pick .sb{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--dim2);margin-top:2px}
.pick .rt{margin-left:auto;text-align:right;font-family:var(--mono)}
.pick .rt .big{font-size:14px;font-weight:700;color:var(--ac)}
.pick .rt .sm{font-size:8px;color:var(--dim2);letter-spacing:.12em}

/* forecast block */
.fc{border-radius:16px;border:1px solid var(--line);padding:13px;margin:4px 0 12px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01))}
.fcrow{display:flex;align-items:center;gap:12px}
.fcbig{font-family:var(--mono);font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--rk);
  text-shadow:0 0 26px color-mix(in srgb,var(--rk) 55%,transparent);line-height:1}
.fclab{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim2);margin-top:4px}
.fcband{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.fcband i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--rk) 35%,transparent),var(--rk));
  border-radius:5px;transition:all .5s}
.brk{display:grid;gap:5px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.brkrow{display:flex;align-items:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em}
.brkrow .k{color:var(--dim)}
.brkrow .v{margin-left:auto;font-weight:700}
.brkrow .v.p{color:var(--gr)}.brkrow .v.n{color:var(--rd)}

/* --- result takeover --- */
#res{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 42%,color-mix(in srgb,var(--oc) 26%,transparent),rgba(3,5,10,.97) 62%),rgba(3,5,10,.97);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#res.on{display:flex;animation:fin .3s ease}
.burst{position:absolute;width:min(78vw,340px);aspect-ratio:1;border-radius:50%;border:1px solid var(--oc);opacity:0;
  animation:burst 1.5s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.rico{width:74px;height:74px;color:var(--oc);filter:drop-shadow(0 0 26px var(--oc));animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.rkind{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--oc);margin-top:16px;
  text-shadow:0 0 18px var(--oc);animation:sIn .5s .1s backwards}
.rttl{font-size:27px;font-weight:900;letter-spacing:-.03em;margin-top:7px;line-height:1.1;animation:sIn .5s .16s backwards}
.rsub{font-size:12.5px;color:var(--dim);margin-top:9px;max-width:300px;line-height:1.55;animation:sIn .5s .22s backwards}
.rew{display:grid;gap:7px;margin:22px 0 6px;width:min(100%,300px);animation:sIn .5s .3s backwards}
.rewrow{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.05)}
.rewrow svg{width:16px;height:16px;color:var(--ac)}
.rewrow .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim)}
.rewrow .v{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:800}
.rewrow.gain .v{color:var(--gr)}.rewrow.loss .v{color:var(--rd)}
.rewrow.drop{border-color:color-mix(in srgb,var(--rc) 50%,transparent);background:color-mix(in srgb,var(--rc) 12%,transparent)}
.rewrow.drop svg{color:var(--rc)}.rewrow.drop .v{font-size:12px;color:var(--rc)}
#res .btn{width:min(100%,300px);margin-top:12px;animation:sIn .5s .38s backwards}

/* --- toast --- */
#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 6px);z-index:80;max-width:520px;margin:0 auto;padding:0 12px;
  display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;
  border:1px solid color-mix(in srgb,var(--tc) 40%,var(--line));
  background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 18%,rgba(10,14,22,.96)),rgba(10,14,22,.96));
  box-shadow:0 14px 34px rgba(0,0,0,.6);animation:tin .4s cubic-bezier(.22,1,.36,1)}
@keyframes tin{from{transform:translateY(-22px);opacity:0}}
.toast.out{animation:tout .35s forwards}
@keyframes tout{to{transform:translateY(-18px);opacity:0}}
.toast svg{width:17px;height:17px;color:var(--tc);flex:0 0 auto}
.toast .t{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--tc)}
.toast .m{font-size:12px;font-weight:600;margin-top:2px;line-height:1.3}

/* --- intro --- */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:var(--bg);
  padding:calc(var(--sat) + 20px) 18px calc(20px + var(--sab));max-width:520px;margin:0 auto;overflow-y:auto}
#intro.hide{animation:iout .55s forwards}
@keyframes iout{to{opacity:0;transform:scale(1.06);visibility:hidden}}
.logo{font-family:var(--mono);font-size:min(13vw,52px);font-weight:800;letter-spacing:.14em;text-align:center;
  background:linear-gradient(100deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(34,211,238,.45));margin-top:6vh}
.tag{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim2);margin-top:8px}
.pitch{text-align:center;font-size:13px;color:var(--dim);line-height:1.65;margin:22px 6px 4px}
.starter{display:flex;gap:11px;align-items:center;padding:13px;border-radius:17px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));margin-bottom:9px;transition:all .2s}
.starter.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 13%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--cc) 45%,transparent),0 14px 34px -18px var(--cc)}
.starter .av{width:60px;height:60px;border-radius:16px;overflow:hidden;flex:0 0 auto;border:1px solid var(--line2)}
.starter .nm{font-size:17px;font-weight:800;letter-spacing:.02em}
.starter .rl{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.35}
.starter .ab{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--cc);margin-top:6px}

.hint{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--dim2);text-align:center;margin-top:10px;line-height:1.7}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--dim2);letter-spacing:.1em}
.kv .v{font-weight:700}
.fade{animation:sIn .4s}
</style>

function ago(t){const s=Math.floor((Date.now()-t)/1000);if(s<60)return s+"s ago";if(s<3600)return Math.floor(s/60)+"m ago";return Math.floor(s/3600)+"h ago"}
function mmss(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);const m=Math.floor(s/60);const r=s%60;return m+":"+String(r).padStart(2,"0")}

/* deterministic tiny hash for procedural portraits */
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function portrait(seed,cls){
  const h=hash(seed), c=CLASSES[cls].c;
  const a=(h&7), b=(h>>3&7), d=(h>>6&3), e=(h>>8&7);
  const eyeY=30+ (h>>11&5);
  const visor=["M18 30h28v9a6 6 0 0 1-6 6H24a6 6 0 0 1-6-6z","M16 28h32v6H16z M20 36h24v8H20z","M18 27l28 3v10l-28 3z"][d%3];
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="g${h%9999}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="#060a12" stop-opacity=".95"/></linearGradient></defs>
  <rect width="64" height="64" fill="#080d18"/><rect width="64" height="64" fill="url(#g${h%9999})"/>
  <g opacity=".28" stroke="${c}" stroke-width=".6">
    ${Array.from({length:5},(_,i)=>`<line x1="0" y1="${8+i*12+a}" x2="64" y2="${8+i*12+a}"/>`).join("")}
  </g>
  <path d="M32 8c11 0 17 7 17 17v10c0 12-7 21-17 21s-17-9-17-21V25c0-10 6-17 17-17z" fill="#0b1220" stroke="${c}" stroke-width="1.4" opacity=".92"/>
  <path d="${visor}" fill="${c}" opacity=".82" transform="translate(0,${eyeY-30})"/>
  <circle cx="${24+ (b%3)}" cy="${eyeY+4}" r="1.9" fill="#fff" opacity=".95"/>
  <circle cx="${40- (b%3)}" cy="${eyeY+4}" r="1.9" fill="#fff" opacity=".95"/>
  <path d="M${20+e} 50h${24-e*2}" stroke="${c}" stroke-width="1.2" opacity=".5"/>
  <path d="M15 25 L8 22 M49 25 L56 22" stroke="${c}" stroke-width="1.2" opacity=".6"/>
  <rect x="0" y="0" width="64" height="64" fill="none" stroke="${c}" stroke-opacity=".35"/>
  </svg>`;
}

function newCrew(cls,lv,name,sp){
  const C=CLASSES[cls], st={};
  STATS.forEach(k=>{ st[k]=clamp(Math.round(rnd(26,44)+(C.bias[k]||0)+lv*1.3),5,100) });
  const tr=[];
  tr.push(pick(TRAITS.pos)[0]);
  if(Math.random()<.45) tr.push(pick(TRAITS.pos)[0]);
  if(Math.random()<.5) tr.push(pick(TRAITS.neg)[0]);
  if(Math.random()<.07) tr.push(pick(TRAITS.rare)[0]);
  return {id:uid(),n:name||pick(NAMES),cls,lv,xp:0,st,tr:[...new Set(tr)],eq:[],sp:sp||null,
    runs:0,wins:0,born:Date.now()};
}
function traitMod(c,stat){
  let m=0;
  for(const t of c.tr){
    for(const g of [TRAITS.pos,TRAITS.neg,TRAITS.rare]){
      const f=g.find(x=>x[0]===t); if(f&&f[1][stat]) m+=f[1][stat];
    }
  }
  return m;
}
function gearMod(c,stat){let m=0;for(const id of c.eq){const it=ITEM(id);if(it&&it.st&&it.st[stat])m+=it.st[stat]}return m}
function stat(c,k){return clamp(Math.round(c.st[k]+traitMod(c,k)+gearMod(c,k)),1,140)}
function crewRank(c){return STATS.reduce((a,k)=>a+stat(c,k),0)/STATS.length}
function crewSyn(c){return SYNERGIES.filter(s=>(!s.cls||s.cls===c.cls)&&s.req.every(r=>c.eq.includes(r)))}

function freshState(starter){
  const st={
    v:1,name:"OPERATOR",title:pick(TITLES),lv:1,xp:0,
    ops:520,scrap:60,intel:3,keys:1,
    crews:[],inv:[],consum:{intelc:2,overdrive:1,insurance:1,fuel:1},
    active:[],log:[],miss:{},disc:{},rep:{},rivals:[],
    daily:{day:today(),objs:[]},week:{score:0},
    stat:{runs:0,wins:0,streak:0,best:0,perfect:0,crit:0,found:0},
    seen:{},pending:0
  };
  FACTIONS.forEach(f=>st.rep[f.id]=0);
  const s=STARTERS.find(x=>x.id===starter);
  st.crews.push(newCrew(s.cls,3,s.n,s.sp));
  st.crews.push(newCrew(pick(["scout","engineer","smuggler","pilot"]),1));
  MAPS.slice(0,2).forEach(m=>st.disc[m.id]=[0,1,2]);
  st.disc.frost=[0];
  st.inv=[{u:uid(),id:"scanner"},{u:uid(),id:"cargoexp"},{u:uid(),id:"toolrig"}];
  st.rivals=RIVAL_NAMES.slice(0,6).map((n,i)=>({n,score:ri(180,900),lv:ri(2,9),hot:false,tag:pick(TITLES)}));
  st.daily.objs=rollDaily();
  return st;
}
function today(){const d=new Date();return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}

function trackObj(k,amt){
  if(!S.daily||!S.daily.objs)return;
  let changed=false;
  S.daily.objs.forEach(o=>{ if(o.k===k&&o.p<o.g){o.p=Math.min(o.g,o.p+(amt||1));changed=true;
    if(o.p>=o.g) toast("OBJECTIVE","Daily objective complete: "+o.n,"#34d399","i-check");} });

/* ============================================================
   6. MISSION GENERATION
   ============================================================ */
function secKey(m,i){return m+":"+i}
function isDisc(m,i){return (S.disc[m]||[]).includes(i)}

function genMission(mapId,sec){
  const M=MAP(mapId);
  const depth=sec/9;
  const catId=pick(Object.keys(CATS)), C=CATS[catId];
  let riskI=wpick([0,1,2,3,4],i=>[42,34,18,7,2.4][i]*(1+depth*i*.55));
  const R=RISKS[riskI];
  const D=wpick(DURS,d=>({instant:16,short:34,medium:26,long:14,exped:7,epic:3})[d.id]);
  const mods=[];
  const nmod=ri(1,3);
  for(let i=0;i<nmod;i++){
    const r=Math.random();
    const src = r<.10 ? "rare" : (r<.52 ? "pos":"neg");
    const raw=pick(MODS[src]);
    if(mods.some(x=>x.n===raw[0]))continue;
    mods.push({n:raw[0],d:raw[1]||0,rw:raw[2]||1,t:src,hidden:Math.random()<(mapId==="void"?.62:.42)});
  }
  const fac=Math.random()<.5?pick(FACTIONS.filter(f=>f.m.includes(catId)))||null:null;
  const secret=Math.random()<.05;
  const base=Math.round((34+sec*7+riskI*26)*(1+S.lv*.055));
  const cost=Math.max(20,Math.round(base*R.cost*D.cost*rnd(.9,1.12)));
  return {
    id:uid(),map:mapId,sec,cat:catId,risk:R.id,dur:D.id,
    n: secret?pick(SECRETS):pick(C.names),
    secret, fac:fac?fac.id:null, mods, cost,
    rwMul: rnd(R.rl,R.rh)*D.rw*M.rw,
    born:Date.now()
  };
}
function missionsFor(mapId,sec){
  const k=secKey(mapId,sec);
  const slot=S.miss[k];
  if(!slot||Date.now()-slot.t>8*60e3||slot.list.length<2){
    const n=ri(3,5);
    S.miss[k]={t:Date.now(),list:Array.from({length:n},()=>genMission(mapId,sec))};
    save();
  }
  return S.miss[k].list;
}
function dropMission(m){
  const k=secKey(m.map,m.sec), slot=S.miss[k];
  if(slot) slot.list=slot.list.filter(x=>x.id!==m.id);
}

/* ============================================================
   7. FORECAST  (crew + gear + modifiers -> success chance)
   ============================================================ */
function forecast(m,crew,cons){
  cons=cons||[];
  const C=CATS[m.cat], R=RISKS.findIndex(r=>r.id===m.risk), RK=RISKS[R], M=MAP(m.map);
  let score=0;
  for(const k in C.w) score+=stat(crew,k)*C.w[k];
  const parts=[];
  let base=RK.lo+(RK.hi-RK.lo)*clamp(score/78,0,1.12);
  parts.push({k:"Crew aptitude",v:Math.round(base-RK.lo),p:true});
  let chance=base;
  if(C.fav.includes(crew.cls)){chance+=8;parts.push({k:"Class specialisation",v:8,p:true})}
  if(M.fav.includes(crew.cls)){chance+=6;parts.push({k:"Map affinity",v:6,p:true})}
  chance+=M.rk; if(M.rk) parts.push({k:M.n+" conditions",v:M.rk,p:M.rk>0});
  let rw=1;
  for(const md of m.mods){
    if(md.hidden&&!cons.includes("intelc")&&crew.sp!=="reveal"&&!crew.eq.includes("oracleeye")) continue;
    let d=md.d;
    if(crew.sp==="override"&&d<0&&(hash(m.id+md.n)%2===0)) d=0;
    chance+=d; rw*=md.rw;
    if(d) parts.push({k:md.n,v:d,p:d>0});
  }
  const syn=crewSyn(crew);
  syn.forEach(s=>{chance+=s.b;parts.push({k:"SYNERGY "+s.n,v:s.b,p:true})});
  cons.forEach(id=>{const c=CONSUM.find(x=>x.id===id);if(c&&c.ch){chance+=c.ch;parts.push({k:c.n,v:c.ch,p:true})}});
  const lb=Math.round(clamp(crewRank(crew)/14,0,7));
  chance+=lb; if(lb) parts.push({k:"Veteran crew",v:lb,p:true});
  chance=clamp(chance,3,97);
  let reward=m.cost*m.rwMul*rw;
  if(cons.includes("dbl")) reward*=1.8;
  if(crew.eq.includes("cargoexp")) reward*=1.1;
  if(crew.cls==="merchant") reward*=1.12;
  if(crew.cls==="smuggler") reward*=1.18;
  return {chance:Math.round(chance),reward:Math.round(reward),parts,syn,rw,
    band:Math.max(3,Math.round(12-crewRank(crew)/12 + (m.map==="void"?7:0) - (cons.includes("oracle")?9:0)))};
}
function durMs(m,crew,cons){
  const D=DURS.find(d=>d.id===m.dur);
  let ms=D.ms;
  const sp=[...crew.eq,...(cons||[])].map(id=>{const it=ITEM(id);return it&&it.sp}).filter(Boolean);
  if(sp.includes("spd50"))ms*=.5; else if(sp.includes("spd40"))ms*=.6; else if(sp.includes("spd35"))ms*=.65; else if(sp.includes("spd20"))ms*=.8;
  if(crew.cls==="pilot")ms*=.85;
  if(MAP(m.map).id==="frost"||MAP(m.map).id==="orbit")ms*=1.15;
  return Math.round(ms);
}

/* ============================================================
   8. LAUNCH + RESOLVE
   ============================================================ */
function launch(m,crew,cons){
  const f=forecast(m,crew,cons);
  if(S.ops<m.cost){toast("DENIED","Not enough Ops for this contract.","#fb5c6c","i-alert");return false}
  if(S.active.length>=SLOTS(S.lv)){toast("NO SLOT","All mission slots are active.","#fbbf24","i-alert");return false}
  S.ops-=m.cost;
  cons.forEach(id=>{S.consum[id]=(S.consum[id]||1)-1;if(S.consum[id]<=0)delete S.consum[id]});
  if(cons.length) trackObj("pow",1);
  const ms=durMs(m,crew,cons);
  S.active.push({a:uid(),m,crewId:crew.id,cons,start:Date.now(),ms,chance:f.chance,reward:f.reward,done:false});
  dropMission(m);
  crew.runs++;
  bumpCur("ops");
  buzz(18);
  save(); render();
  return true;
}

function rollOutcome(A,crew){
  const noise=rnd(-5,5);
  const eff=clamp(A.chance+noise,2,98);
  const roll=rnd(0,100);
  const vol=A.cons.includes("overdrive")?1.35:1;
  let k;
  if(roll<=eff){
    const margin=eff-roll;
    if(margin>44&&Math.random()<.34) k="perfect";
    else if(Math.random()<.035*vol) k="jackpot";
    else if(Math.random()<.075+(crew.cls==="scout"?.05:0)) k="discovery";
    else k="success";
  }else{
    const over=roll-eff;
    if(over<11) k="partial";
    else if(over>36&&Math.random()<.34*vol) k="critical";
    else k="failure";
    if(Math.random()<.09) k="ambush";
  }
  if((A.m.map==="void"||A.m.map==="ruins")&&Math.random()<.09) k="anomaly";
  const protect=crew.sp==="nocrit"||crew.eq.some(id=>{const i=ITEM(id);return i&&i.sp==="nocrit"})
    ||crewSyn(crew).some(s=>s.n==="IRON WALL");
  if(k==="critical"&&protect) k="failure";
  if((k==="failure"||k==="critical")&&A.cons.includes("retry")&&Math.random()<.6) k="partial";
  return k;
}

function resolve(A){
  const crew=S.crews.find(c=>c.id===A.crewId)||newCrew("scout",1,"GHOST");
  const k=rollOutcome(A,crew), O=OUTCOMES[k];
  const R=RISKS.find(r=>r.id===A.m.risk);
  const rw={ops:0,scrap:0,intel:0,keys:0,xp:0,items:[],sector:null,note:""};
  const win=["perfect","jackpot","discovery","success","partial","anomaly"].includes(k);

  rw.ops=Math.round(A.reward*O.f);
  if(k==="failure"&&A.cons.includes("insure")) {rw.ops=Math.round(A.m.cost*.6);rw.note="Insurance recovered part of the entry cost."}
  if(k==="critical") rw.ops=Math.round(-A.m.cost*.3);
  rw.xp=Math.round(24*R.xp*O.xp*(1+A.m.sec*.06));
  rw.scrap=win?Math.round(rnd(4,16)*R.xp*O.xp):Math.round(rnd(0,4));
  if(win&&Math.random()<.22+R.xp*.04) rw.intel=ri(1,2);
  if(win&&Math.random()<.05+R.xp*.02) rw.keys=1;

  // loot
  const lootChance={safe:.16,standard:.26,risky:.4,extreme:.62,legendary:.9}[A.m.risk]*(win?1:.15)
    *(A.cons.includes("charm")?1.35:1)*(crew.cls==="scientist"?1.2:1);
  if(Math.random()<lootChance){
    const tierBoost={safe:1,standard:1.3,risky:2.1,extreme:3.4,legendary:6}[A.m.risk];
    const pool=[...ADDONS,...(A.m.risk==="extreme"||A.m.risk==="legendary"?ARTIFACTS:[])];
    const it=wpick(pool,x=>RARITY[x.r].w*(x.r==="common"?1:tierBoost));
    rw.items.push(it.id);
  }
  if(k==="jackpot") {rw.items.push(wpick(ADDONS,x=>RARITY[x.r].w*3).id); rw.keys+=1}
  if(k==="discovery"){
    const M=MAP(A.m.map), have=S.disc[A.m.map]||[];
    const un=M.sec.map((_,i)=>i).filter(i=>!have.includes(i));
    if(un.length){const s=pick(un);(S.disc[A.m.map]=have).push(s);rw.sector=M.sec[s];S.stat.found++;trackObj("disc",1)}
    else rw.items.push(wpick(ADDONS,x=>RARITY[x.r].w).id);
  }
  if(k==="anomaly"){
    const eff=pick(["Temporal echo: Ops doubled.","Signal ghost: crew XP doubled.","Null residue: recovered a Key.","Reality shift: extra Intel."]);
    rw.note=eff;
    if(eff.startsWith("Temporal"))rw.ops*=2;
    if(eff.startsWith("Signal"))rw.xp*=2;
    if(eff.startsWith("Null"))rw.keys+=1;
    if(eff.startsWith("Reality"))rw.intel+=2;
  }
  if(k==="ambush"){
    const r=pick(S.rivals); r.score+=ri(40,120); r.hot=true;
    rw.note=r.n+" intercepted the run and took the payload.";
  }
  if(A.cons.includes("bm")) rw.ops=Math.round(rw.ops*1.25);

  // consumable drop
  if(win&&Math.random()<.2){const c=wpick(CONSUM,x=>RARITY[x.r].w);S.consum[c.id]=(S.consum[c.id]||0)+1;rw.note=rw.note||("Recovered a "+c.n+".")}

  // apply
  S.ops=Math.max(0,S.ops+rw.ops);
  S.scrap+=rw.scrap; S.intel+=rw.intel; S.keys+=rw.keys;
  rw.items.forEach(id=>S.inv.push({u:uid(),id}));
  const lvUps=addXP(rw.xp), cUp=addCrewXP(crew,Math.round(rw.xp*1.1));
  if(A.m.fac) S.rep[A.m.fac]=(S.rep[A.m.fac]||0)+(win?ri(6,14):2);

  // stats + objectives
  S.stat.runs++; trackObj("runs",1);
  if(win){S.stat.wins++;S.stat.streak++;S.stat.best=Math.max(S.stat.best,S.stat.streak);crew.wins++;trackObj("wins",1);
    if(A.m.risk==="risky"||A.m.risk==="extreme"||A.m.risk==="legendary")trackObj("risky",1);
    if(A.m.fac)trackObj("fac",1);
    trackObj("ops",Math.max(0,rw.ops));
    S.week.score+=Math.round(rw.ops*.35+R.xp*22);
  } else S.stat.streak=0;
  if(k==="perfect")S.stat.perfect++;
  if(k==="critical")S.stat.crit++;

  // rival simulation
  tickRivals(win?rw.ops:0);

  S.active=S.active.filter(x=>x.a!==A.a);
  logAdd(k,A,rw,crew);
  save();
  return {k,O,rw,crew,A,lvUps,cUp};
}

function addXP(x){
  S.xp+=x; let ups=0;
  while(S.xp>=NEED_XP(S.lv)&&S.lv<100){S.xp-=NEED_XP(S.lv);S.lv++;ups++}
  return ups;
}
function addCrewXP(c,x){
  c.xp+=x; let ups=0;
  while(c.xp>=CREW_NEED(c.lv)&&c.lv<50){
    c.xp-=CREW_NEED(c.lv);c.lv++;ups++;
    const gain=[...STATS].sort(()=>Math.random()-.5).slice(0,3);
    gain.forEach(k=>c.st[k]=clamp(c.st[k]+ri(1,3),1,100));
  }
  return ups;
}
function logAdd(k,A,rw,crew){
  const O=OUTCOMES[k];
  S.log.unshift({t:Date.now(),c:O.c,x:`<b>${esc(crew.n)}</b> ${k==="failure"||k==="critical"?"lost":"finished"} <b>${esc(A.m.n)}</b> - ${O.n}${rw.ops?` (${rw.ops>0?"+":""}${fmt(rw.ops)} Ops)`:""}`});
  S.log=S.log.slice(0,40);
}
function tickRivals(gain){
  S.rivals.forEach(r=>{
    r.score+=ri(0,55)+Math.round(gain*rnd(.02,.1));
    if(Math.random()<.05)r.lv++;
  });
  const me=S.week.score;
  S.rivals.forEach(r=>{
    if(!r.hot&&r.score>me&&r.score-me<160&&Math.random()<.25){
      r.hot=true;
      toast("RIVAL",r.n+" just passed your weekly score.","#ff3ad4","i-rival");
      S.log.unshift({t:Date.now(),c:"#ff3ad4",x:`<b>${r.n}</b> overtook you on the weekly board. Revenge available.`});
    }
  });
}

/* ---------- MAPS ---------- */
function scMaps(){
  if(!UI.map) return mapList();
  if(UI.sec===null) return sectorList();
  return missionList();
}
function mapList(){
  let h=`<h2 class="title">Sector Network</h2><p class="lede">Nine environments. Each one shifts probabilities, durations, loot tables and which crew classes matter.</p>`;
  MAPS.forEach(M=>{
    const lock=S.lv<M.lv;
    const found=(S.disc[M.id]||[]).length;
    h+=`<div class="card mapcard tap ${lock?"locked":""}" data-act="${lock?"":"map"}" data-id="${M.id}" style="--mc:${M.ac}">
      <div class="art" style="background:
        radial-gradient(120% 90% at 85% 20%, ${M.ac}55, transparent 60%),

        linear-gradient(120deg,#0a0f1c,#060a13)"></div>
      <div class="shade"></div>
      <div class="in"><div class="idx">${M.idx}</div><div class="nm">${M.n}</div>
        <div class="ds">${lock?"Unlocks at operator level "+M.lv:M.d}</div></div>
      ${lock?`<div class="lockbadge">${ico("i-lock")} LV ${M.lv}</div>`:`<div class="lockbadge" style="color:${M.ac};border-color:${M.ac}55">${found}/10 SECTORS</div>`}
    </div>`;

}
function sectorList(){
  const M=MAP(UI.map), disc=S.disc[M.id]||[];

    <div class="x tap" data-act="back">${ico("i-back")}</div>
    <div><div class="mono" style="font-size:8.5px;letter-spacing:.24em;color:${M.ac}">${M.idx}</div>
    <div style="font-size:20px;font-weight:800;letter-spacing:-.02em">${M.n}</div></div></div>
  <p class="lede">${M.d}</p>
  <div class="chiprow" style="margin:9px 0 2px">${M.mods.map(x=>`<span class="chip ${x.startsWith("+")?"pos":""}">${esc(x)}</span>`).join("")}
  <span class="chip rare">EVENT: ${M.ev}</span></div>
  <div class="sect">Sectors <span class="cnt">${disc.length}/10 DISCOVERED</span></div><div class="sgrid">`;
  M.sec.forEach((s,i)=>{
    const d=disc.includes(i);
    h+=`<div class="scell ${d?"tap":"undisc"}" ${d?`data-act="sec" data-i="${i}"`:""} style="--ac:${M.ac}">
      ${d?`<div class="dot"></div>`:""}
      <div class="n">${d?esc(s):"UNDISCOVERED"}</div>
      <div class="m">${d?`DEPTH ${i+1} · ${missionsFor(M.id,i).length} CONTRACTS`:"RUN EXPLORATION OPS"}</div></div>`;
  });

  return h;
}
function missionList(){
  const M=MAP(UI.map), sec=UI.sec, list=missionsFor(M.id,sec);
  let h=`<div style="display:flex;align-items:center;gap:8px;margin:4px 0 6px">
    <div class="x tap" data-act="backsec">${ico("i-back")}</div>
    <div><div class="mono" style="font-size:8.5px;letter-spacing:.24em;color:${M.ac}">${M.n} · DEPTH ${sec+1}</div>
    <div style="font-size:20px;font-weight:800;letter-spacing:-.02em">${M.sec[sec]}</div></div></div>
  <p class="lede">Contracts refresh over time. Displayed probability is an estimate, not the underlying calculation.</p>
  <div class="sect">Available contracts <span class="cnt">${list.length}</span></div>`;
  const crew=S.crews.filter(c=>!S.active.some(a=>a.crewId===c.id));
  list.forEach(m=>{
    const best=crew.length?crew.reduce((a,b)=>forecast(m,a).chance>=forecast(m,b).chance?a:b):null;
    const f=best?forecast(m,best):{chance:0,reward:m.cost*m.rwMul};
    const R=RISKS.find(r=>r.id===m.risk), D=DURS.find(d=>d.id===m.dur);
    const fac=m.fac?FACTIONS.find(x=>x.id===m.fac):null;
    h+=`<div class="card mcard tap r-${m.risk}" data-act="mission" data-id="${m.id}">
      <div class="mhead"><div style="min-width:0">
        <div class="mname">${m.secret?`<span style="color:var(--vi)">◈ </span>`:""}${esc(m.n)}</div>
        <div class="mmeta">${CATS[m.cat].n} · ${R.n} · ${D.label}</div>
        <div class="chiprow" style="margin-top:8px">
          ${fac?`<span class="chip" style="color:${fac.c};border-color:${fac.c}55">${fac.n}</span>`:""}
          ${m.mods.map(md=>md.hidden?`<span class="chip">◇ UNKNOWN</span>`:`<span class="chip ${md.t==="rare"?"rare":md.t==="pos"?"pos":"neg"}">${esc(md.n)}</span>`).join("")}
        </div></div>
        <div class="ring" style="--p:${f.chance}"><i>${f.chance}%</i><b>EST</b></div>
      </div>
      <div class="mfoot">
        <div class="stat"><span class="k">ENTRY</span><span class="v ops">${fmt(m.cost)}</span></div>
        <div class="stat"><span class="k">PAYOUT</span><span class="v">~${fmt(f.reward)}</span></div>
        <div class="stat"><span class="k">TIME</span><span class="v">${mmss(DURS.find(d=>d.id===m.dur).ms)}</span></div>
        <div class="go">DEPLOY</div>
      </div></div>`;
  });
  return h;
}

      <div class="r">${RARITY[it.r].n}${eq?" · ON "+esc(eq.n):""}</div></div>`});

  arts.forEach(x=>{const it=ITEM(x.id), eq=S.crews.find(c=>c.eq.includes(x.id));
    h+=`<div class="gitem tap ${eq?"equipped":""}" data-act="item" data-id="${x.id}" style="--rc:${rc(it.r)}">
      ${ico(it.ic,"ic")}<div class="n">${it.n}</div><div class="e">${it.e}</div>
      <div class="r">${RARITY[it.r].n}${eq?" · ON "+esc(eq.n):""}</div></div>`});

      <div style="display:flex;align-items:center;gap:8px">
        <div style="font-family:var(--mono);font-size:11px;letter-spacing:.18em;font-weight:700;color:${on?"var(--gr)":"var(--dim)"}">${s.n}</div>

  h+=`<div class="sect">Crafting</div>
  <div class="card" style="padding:13px">

/* ============================================================
   11. SHEETS
   ============================================================ */
const wrap=$("#sheetwrap"), sheet=$("#sheet");
let SH=null;
function openSheet(html){sheet.innerHTML=`<div class="grab"></div>`+html;wrap.classList.add("on");sheet.scrollTop=0}
function closeSheet(){wrap.classList.remove("on");SH=null}
$("#sheetbg").addEventListener("click",closeSheet);

/* ---- mission launch ---- */
function sheetMission(m){
  const avail=S.crews.filter(c=>!S.active.some(a=>a.crewId===c.id));
  if(!SH||SH.type!=="mission"||SH.m.id!==m.id){
    SH={type:"mission",m,crew:avail[0]?avail[0].id:null,cons:[]};
    if(avail.length) SH.crew=avail.reduce((a,b)=>forecast(m,a).chance>=forecast(m,b).chance?a:b).id;
  }
  drawMissionSheet();
}
function drawMissionSheet(){
  const m=SH.m, M=MAP(m.map), R=RISKS.find(r=>r.id===m.risk), D=DURS.find(d=>d.id===m.dur);
  const avail=S.crews.filter(c=>!S.active.some(a=>a.crewId===c.id));
  const crew=S.crews.find(c=>c.id===SH.crew);
  const f=crew?forecast(m,crew,SH.cons):{chance:0,reward:0,parts:[],syn:[],band:10};
  const ms=crew?durMs(m,crew,SH.cons):D.ms;
  const fac=m.fac?FACTIONS.find(x=>x.id===m.fac):null;
  const lo=clamp(f.chance-f.band,2,99), hi=clamp(f.chance+f.band,3,99);
  const cons=Object.keys(S.consum).filter(k=>S.consum[k]>0);
  let h=`<div class="shead r-${m.risk}">
    <div><div class="t">${m.secret?"◈ ":""}${esc(m.n)}</div>
    <div class="s">${CATS[m.cat].n} · ${R.n} · ${M.n} / ${M.sec[m.sec]}</div></div>
    <div class="x tap" data-act="closesheet">${ico("i-x")}</div></div>`;
  h+=`<div class="chiprow" style="margin-bottom:11px">
    ${fac?`<span class="chip" style="color:${fac.c};border-color:${fac.c}55">${fac.n}</span>`:""}
    <span class="chip">${D.n} · ${D.label}</span>
    ${m.mods.map(md=>{
      const known=!md.hidden||SH.cons.includes("intelc")||(crew&&(crew.sp==="reveal"||crew.eq.includes("oracleeye")));
      return known?`<span class="chip ${md.t==="rare"?"rare":md.t==="pos"?"pos":"neg"}">${esc(md.n)} ${md.d?(md.d>0?"+":"")+md.d+"%":""}</span>`
        :`<span class="chip">◇ HIDDEN MODIFIER</span>`}).join("")}</div>`;

  h+=`<div class="fc r-${m.risk}"><div class="fcrow">
      <div><div class="fcbig">${f.chance}%</div><div class="fclab">ESTIMATED SUCCESS</div></div>
      <div style="flex:1">
        <div class="fcband"><i style="left:${lo}%;right:${100-hi}%"></i></div>
        <div class="fclab" style="margin-top:6px">CONFIDENCE BAND ${lo}-${hi}%</div>
      </div></div>
    <div class="brk">
      ${f.parts.slice(0,7).map(p=>`<div class="brkrow"><span class="k">${esc(p.k)}</span><span class="v ${p.p?"p":"n"}">${p.v>0?"+":""}${p.v}</span></div>`).join("")}
      <div class="brkrow" style="border-top:1px solid var(--line);padding-top:7px;margin-top:2px">
        <span class="k">HIDDEN VARIABLES</span><span class="v" style="color:var(--dim2)">${m.mods.filter(x=>x.hidden).length + 2 + hash(m.id)%4} NOT SHOWN</span></div>
    </div></div>`;

  h+=`<div class="sect">Select crew</div>`;
  if(!avail.length) h+=`<div class="slotempty">EVERY CREW IS DEPLOYED</div>`;
  avail.forEach(c=>{
    const cf=forecast(m,c,SH.cons), C=CLASSES[c.cls];
    h+=`<div class="pick ${SH.crew===c.id?"on":""} tap" data-act="pickcrew" data-id="${c.id}">
      <div class="av">${portrait(c.id,c.cls)}</div>
      <div style="min-width:0"><div class="nm">${esc(c.n)}</div>
      <div class="sb" style="color:${C.c}">${C.n} · LV ${c.lv}</div></div>
      <div class="rt"><div class="big">${cf.chance}%</div><div class="sm">${fmt(cf.reward)} OPS</div></div></div>`;
  });

  h+=`<div class="sect">Power-ups <span class="cnt">${SH.cons.length}/2</span></div>`;
  if(!cons.length) h+=`<div class="slotempty">NO POWER-UPS IN INVENTORY</div>`;
  cons.forEach(id=>{
    const it=CONSUM.find(c=>c.id===id), on=SH.cons.includes(id);
    const dis=!on&&SH.cons.length>=2;
    h+=`<div class="pick ${on?"on":""} ${dis?"off":"tap"}" ${dis?"":`data-act="pickcons" data-id="${id}"`}>
      <div style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:${rc(it.r)}22;color:${rc(it.r)}">${ico(it.ic)}</div>
      <div style="min-width:0"><div class="nm">${it.n}</div><div class="sb">${it.e}</div></div>
      <div class="rt"><div class="big" style="color:${rc(it.r)}">x${S.consum[id]}</div></div></div>`;
  });

  const afford=crew&&S.ops>=m.cost, slot=S.active.length<SLOTS(S.lv);
  h+=`<div class="fc" style="margin-top:14px">
    <div style="display:flex;gap:14px">
      <div class="stat"><span class="k">ENTRY COST</span><span class="v ops">${fmt(m.cost)}</span></div>
      <div class="stat"><span class="k">ON SUCCESS</span><span class="v" style="color:var(--gr)">+${fmt(f.reward)}</span></div>
      <div class="stat"><span class="k">DURATION</span><span class="v">${mmss(ms)}</span></div>
    </div></div>
  <button class="btn" data-act="launch" ${afford&&slot?"":"disabled"}>
    ${!crew?"NO CREW AVAILABLE":!slot?"NO FREE MISSION SLOT":!afford?"NOT ENOUGH OPS":"LAUNCH MISSION · "+fmt(m.cost)+" OPS"}</button>
  <div class="hint">MISSION RESOLVES ON ITS OWN TIMER<br>YOU WILL BE NOTIFIED WHEN IT LANDS</div>`;
  openSheet(h);
}

  h+=`<div class="sect">Class abilities</div><div class="chiprow">${C.ab.map(a=>`<span class="chip ac">${a}</span>`).join("")}</div>`;
  if(c.sp) h+=`<div class="card" style="padding:11px 13px;margin-top:9px;border-color:${C.c}55">
    <div class="mono" style="font-size:9px;letter-spacing:.2em;color:${C.c}">SIGNATURE</div>
    <div style="font-size:12.5px;margin-top:5px">${STARTERS.find(s=>s.sp===c.sp)?STARTERS.find(s=>s.sp===c.sp).ab:"Unique protocol"}</div></div>`;
  if(syn.length) h+=`<div class="sect">Active synergies</div>${syn.map(s=>`<div class="card" style="padding:11px 13px;border-color:var(--gr)">
    <div class="mono" style="font-size:10px;letter-spacing:.18em;color:var(--gr)">${s.n} +${s.b}%</div>
    <div style="font-size:11.5px;color:var(--dim);margin-top:5px">${s.e}</div></div>`).join("")}`;

  h+=`<div class="sect">Equipment <span class="cnt">${c.eq.length}/${slots}</span></div>`;
  c.eq.forEach(id=>{const it=ITEM(id);
    h+=`<div class="pick tap" data-act="unequip" data-c="${c.id}" data-id="${id}">
      <div style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:${rc(it.r)}22;color:${rc(it.r)}">${ico(it.ic)}</div>
      <div style="min-width:0"><div class="nm">${it.n}</div><div class="sb">${it.e}</div></div>
      <div class="rt"><div class="sm" style="color:var(--rd)">REMOVE</div></div></div>`});
  for(let i=c.eq.length;i<slots;i++) h+=`<div class="slotempty" style="padding:11px">EMPTY SLOT ${i+1}</div>`;
  if(slots<7) h+=`<div class="hint" style="margin:2px 0 6px">NEXT SLOT AT CREW LEVEL ${[10,25,40].find(l=>l>c.lv)||50}</div>`;
  if(c.eq.length<slots&&free.length){
    h+=`<div class="sect">Available</div>`;
    free.forEach(x=>{const it=ITEM(x.id);
      h+=`<div class="pick tap" data-act="equip" data-c="${c.id}" data-id="${x.id}">
        <div style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:${rc(it.r)}22;color:${rc(it.r)}">${ico(it.ic)}</div>
        <div style="min-width:0"><div class="nm">${it.n}</div><div class="sb">${it.e}</div></div>
        <div class="rt"><div class="sm" style="color:var(--ac)">EQUIP</div></div></div>`});
  }
  openSheet(h);
}

/* ---- item ---- */
function sheetItem(id){
  const it=ITEM(id);
  const holder=S.crews.find(c=>c.eq.includes(id));
  let h=`<div class="shead"><div><div class="t">${it.n}</div>
    <div class="s" style="color:${rc(it.r)}">${RARITY[it.r].n} · ${ARTIFACTS.some(a=>a.id===id)?"ARTIFACT":"ADD-ON"}</div></div>
    <div class="x tap" data-act="closesheet">${ico("i-x")}</div></div>
    <div class="card" style="padding:13px;border-color:${rc(it.r)}44">
      <div style="font-size:13px;line-height:1.5">${it.e}</div>
      <div class="chiprow" style="margin-top:10px">${Object.entries(it.st||{}).map(([k,v])=>
        `<span class="chip ${v>0?"pos":"neg"}">${STAT_N[k]} ${v>0?"+":""}${v}</span>`).join("")}</div></div>`;
  h+=`<div class="sect">${holder?"Equipped on":"Assign to crew"}</div>`;
  S.crews.forEach(c=>{
    const on=c.eq.includes(id), full=c.eq.length>=EQ_SLOTS(c.lv);
    h+=`<div class="pick ${on?"on":""} ${full&&!on?"off":"tap"}" ${full&&!on?"":`data-act="${on?"unequip":"equip"}" data-c="${c.id}" data-id="${id}"`}>
      <div class="av">${portrait(c.id,c.cls)}</div>
      <div><div class="nm">${esc(c.n)}</div><div class="sb" style="color:${CLASSES[c.cls].c}">${CLASSES[c.cls].n} · ${c.eq.length}/${EQ_SLOTS(c.lv)}</div></div>
      <div class="rt"><div class="sm" style="color:${on?"var(--rd)":full?"var(--dim2)":"var(--ac)"}">${on?"REMOVE":full?"FULL":"EQUIP"}</div></div></div>`;
  });
  openSheet(h);
}

/* ============================================================
   12. RESULT TAKEOVER
   ============================================================ */
function showResult(r){
  const {k,O,rw,crew,A,lvUps,cUp}=r;
  const el=$("#res"); el.style.setProperty("--oc",O.c);
  const rows=[];
  if(rw.ops) rows.push({ic:"i-ops",k:"OPS",v:(rw.ops>0?"+":"")+fmt(rw.ops),cls:rw.ops>0?"gain":"loss"});
  if(rw.scrap) rows.push({ic:"i-scrap",k:"SCRAP",v:"+"+fmt(rw.scrap),cls:"gain"});
  if(rw.intel) rows.push({ic:"i-intel",k:"INTEL",v:"+"+rw.intel,cls:"gain"});
  if(rw.keys) rows.push({ic:"i-key",k:"KEYS",v:"+"+rw.keys,cls:"gain"});
  if(rw.xp) rows.push({ic:"i-xp",k:"XP",v:"+"+rw.xp,cls:"gain"});
  el.innerHTML=`<div class="burst"></div><div class="burst" style="animation-delay:.18s"></div>
    ${ico(O.ic,"rico")}
    <div class="rkind">${O.n}</div>
    <div class="rttl">${esc(A.m.n)}</div>
    <div class="rsub">${O.t} ${rw.note?"<br>"+esc(rw.note):""}${rw.sector?`<br>New sector unlocked: <b style="color:${O.c}">${esc(rw.sector)}</b>`:""}</div>
    <div class="rew">
      ${rows.map(r=>`<div class="rewrow ${r.cls}">${ico(r.ic)}<span class="k">${r.k}</span><span class="v">${r.v}</span></div>`).join("")}
      ${rw.items.map(id=>{const it=ITEM(id);return `<div class="rewrow drop" style="--rc:${rc(it.r)}">${ico(it.ic)}<span class="k">${RARITY[it.r].n}</span><span class="v">${it.n}</span></div>`}).join("")}
      ${lvUps?`<div class="rewrow" style="border-color:var(--ac)">${ico("i-star")}<span class="k">OPERATOR</span><span class="v" style="color:var(--ac)">LEVEL ${S.lv}</span></div>`:""}
      ${cUp?`<div class="rewrow" style="border-color:${CLASSES[crew.cls].c}">${ico("i-star")}<span class="k">${esc(crew.n)}</span><span class="v" style="color:${CLASSES[crew.cls].c}">LEVEL ${crew.lv}</span></div>`:""}
    </div>
    <button class="btn" data-act="closeres">CONTINUE</button>`;
  el.classList.add("on");
  buzz(k==="critical"?[30,60,30]:[14,40,14]);
}

/* ============================================================
   13. INTERACTION
   ============================================================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  const nb=e.target.closest("[data-tab]");
  if(nb){UI.tab=nb.dataset.tab;if(UI.tab!=="maps"){UI.map=null;UI.sec=null}buzz(8);render();return}
  if(!t)return;
  const a=t.dataset.act;
  buzz(8);
  switch(a){
    case "map": UI.map=t.dataset.id;UI.sec=null;render();break;
    case "back": UI.map=null;UI.sec=null;render();break;
    case "backsec": UI.sec=null;render();break;
    case "sec": UI.sec=+t.dataset.i;render();break;
    case "mission":{
      const list=missionsFor(UI.map,UI.sec), m=list.find(x=>x.id===t.dataset.id);
      if(m) sheetMission(m); break;
    }
    case "pickcrew": SH.crew=t.dataset.id; drawMissionSheet(); break;
    case "pickcons":{
      const id=t.dataset.id;
      SH.cons=SH.cons.includes(id)?SH.cons.filter(x=>x!==id):[...SH.cons,id].slice(0,2);
      drawMissionSheet(); break;
    }
    case "launch":{
      const crew=S.crews.find(c=>c.id===SH.crew), nm=SH.m.n;
      if(crew&&launch(SH.m,crew,SH.cons)){
        closeSheet(); UI.tab="home"; UI.map=null; UI.sec=null;
        toast("DEPLOYED",esc(crew.n)+" is running "+esc(nm),"#22d3ee","i-bolt");
        render();
      }
      break;
    }
    case "claim":{
      const A=S.active.find(x=>x.a===t.dataset.a);
      if(A&&Date.now()-A.start>=A.ms){ const r=resolve(A); render(); showResult(r) }
      break;
    }
    case "peek":{
      const A=S.active.find(x=>x.a===t.dataset.a);
      if(A) toast("IN PROGRESS",mmss(A.ms-(Date.now()-A.start))+" remaining · est "+A.chance+"%","#fbbf24","i-clock");
      break;
    }
    case "closeres": $("#res").classList.remove("on"); render(); break;
    case "closesheet": closeSheet(); break;
    case "crew":{const c=S.crews.find(x=>x.id===t.dataset.id); if(c) sheetCrew(c); break}
    case "item": sheetItem(t.dataset.id); break;
    case "equip":{
      const c=S.crews.find(x=>x.id===t.dataset.c), id=t.dataset.id;
      if(c&&c.eq.length<EQ_SLOTS(c.lv)&&!S.crews.some(x=>x.eq.includes(id))){c.eq.push(id);save();sheetCrew(c);render()}
      break;
    }
    case "unequip":{
      const c=S.crews.find(x=>x.id===t.dataset.c);
      if(c){c.eq=c.eq.filter(x=>x!==t.dataset.id);save();sheetCrew(c);render()}
      break;
    }
    case "hire":{
      if(S.ops<450)break;
      S.ops-=450;
      const c=newCrew(pick(Object.keys(CLASSES)),Math.max(1,S.lv-1));
      S.crews.push(c); save(); render();
      toast("RECRUITED",c.n+" · "+CLASSES[c.cls].n,CLASSES[c.cls].c,"i-crew");
      sheetCrew(c);
      break;
    }
    case "craft":{
      if(S.scrap<80)break;
      S.scrap-=80;
      const it=wpick(ADDONS,x=>RARITY[x.r].w*1.4);
      S.inv.push({u:uid(),id:it.id}); save(); render();
      toast("FABRICATED",it.n+" · "+RARITY[it.r].n,rc(it.r),"i-gear");
      break;
    }
    case "claimobj":{
      const o=S.daily.objs[+t.dataset.i];
      if(o&&o.p>=o.g&&!o.claimed){
        o.claimed=true;
        S.ops+=o.rw.ops||0; S.scrap+=o.rw.scrap||0; S.intel+=o.rw.intel||0; S.keys+=o.rw.keys||0;
        save(); render(); bumpCur("ops");
        toast("CLAIMED","+"+fmt(o.rw.ops||0)+" Ops from daily objective","#34d399","i-check");
      }
      break;
    }
    case "revenge":{
      const r=S.rivals.find(x=>x.n===t.dataset.n);
      if(r){
        r.hot=false;
        S.week.score+=ri(60,160);
        S.ops+=ri(80,220);
        trackObj("rival",1);
        save(); render(); bumpCur("ops");
        toast("REVENGE","You clawed back points from "+r.n,"#ff3ad4","i-rival");
      }
      break;
    }
    case "reset":
      if(confirm("Wipe this save and start over?")){localStorage.removeItem(SAVE_KEY);location.reload()}
      break;
  }
});

/* ============================================================
   14. LOOP
   ============================================================ */
function tick(){
  if(!S)return;
  let dirty=false;
  S.active.forEach(A=>{
    const el=Date.now()-A.start;
    if(el>=A.ms&&!A.notified){
      A.notified=true; dirty=true;
      const c=S.crews.find(x=>x.id===A.crewId);
      toast("MISSION COMPLETE",(c?c.n:"Crew")+" is back from "+A.m.n,"#34d399","i-signal");
      save();
    }
  });
  if(UI.tab==="home"&&!wrap.classList.contains("on")&&!$("#res").classList.contains("on")){
    S.active.forEach(A=>{
      const card=$(`[data-a="${A.a}"]`); if(!card)return;
      const el=Date.now()-A.start, done=el>=A.ms;
      const tEl=$(".tmr .t",card), lEl=$(".tmr .l",card), bar=$(".prog i",card);
      if(bar) bar.style.width=clamp(el/A.ms*100,0,100)+"%";
      if(tEl) tEl.textContent=done?"READY":mmss(A.ms-el);
      if(lEl&&done) lEl.textContent="TAP TO CLAIM";
      if(done&&!card.classList.contains("ready")){card.classList.add("ready");card.dataset.act="claim"}
    });
  }
  if(dirty) renderTop();
}
setInterval(tick,1000);
setInterval(()=>{ if(S){tickRivals(0);save();if(UI.tab==="rivals")render()} },45000);

/* daily rollover */
function checkDaily(){
  if(S.daily.day!==today()){S.daily={day:today(),objs:rollDaily()};S.week.score=Math.round(S.week.score*.8);save()}
}

/* ============================================================
   15. INTRO / BOOT
   ============================================================ */
function intro(){
  let sel=null;
  const el=$("#intro");
  const draw=()=>{
    el.innerHTML=`
      <div class="logo">DISPATCH</div>
      <div class="tag">ASYNCHRONOUS OPERATIONS NETWORK</div>
      <div class="pitch">Send a crew into a sector. Pay the entry cost.<br>Walk away. Something happens without you.</div>
      <div class="sect" style="margin-top:20px">Choose your first operative</div>
      ${STARTERS.map(s=>{const C=CLASSES[s.cls];
        return `<div class="starter ${sel===s.id?"on":""}" data-s="${s.id}" style="--cc:${C.c}">
          <div class="av">${portrait(s.id,s.cls)}</div>
          <div style="min-width:0"><div class="nm">${s.n} <span class="cls" style="--cc:${C.c}">${C.n}</span></div>
          <div class="rl">${s.role}</div><div class="ab">${s.ab}</div></div></div>`}).join("")}
      <div style="height:8px"></div>
      <button class="btn" id="startbtn" ${sel?"":"disabled"}>${sel?"ENTER THE NETWORK":"SELECT AN OPERATIVE"}</button>
      <div class="hint">PROTOTYPE BUILD · MISSION TIMERS COMPRESSED<br>PROGRESS SAVES TO THIS DEVICE</div>`;
    $$("[data-s]",el).forEach(n=>n.onclick=()=>{sel=n.dataset.s;buzz(8);draw()});
    const b=$("#startbtn",el);
    if(b) b.onclick=()=>{
      if(!sel)return;
      S=freshState(sel); save();
      el.classList.add("hide");
      setTimeout(()=>{el.style.display="none"},560);
      boot();
      toast("WELCOME","Your first crew is standing by. Open MAPS.","#22d3ee","i-signal");
    };
  };
  draw();
}
function boot(){
  checkDaily();
  UI.tab="home";
  render();
}
(function init(){
  const s=load();
  if(s){S=s;$("#intro").style.display="none";boot();
    const ready=S.active.filter(a=>Date.now()-a.start>=a.ms).length;
    if(ready) setTimeout(()=>toast("WHILE YOU WERE AWAY",ready+" mission"+(ready>1?"s":"")+" finished and can be claimed.","#34d399","i-signal"),600);
  } else intro();
})();
</script>
